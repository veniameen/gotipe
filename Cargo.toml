[workspace]
resolver = "2"
members = [
    "crates/gotipe-schema",
    "crates/gotipe-core",
    "crates/gotipe-crdt",
    "crates/gotipe-comments",
    "crates/gotipe-versioning",
    "crates/gotipe-ai",
    "crates/gotipe-export",
    "crates/gotipe-export-wasm",
    "crates/gotipe-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/gotipe/gotipe"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wasm-bindgen = "0.2"
uuid = { version = "1.0", features = ["v4", "v7", "js"] }
chrono = { version = "0.4", features = ["serde"] }
zstd = { version = "0.13.4", features = ["wasm", "no_asm"] }
regex = { version = "1.11", default-features = false, features = ["std", "perf", "unicode-perl"] }

# Export
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
zip = { version = "9.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ammonia = "4.2.4"

# Testing
criterion = "0.5"
proptest = "1.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[profile.bench]
opt-level = 3
lto = true

# Typst's released citationberg still pins vulnerable quick-xml 0.38.
# Use the upstream security fix until citationberg publishes it (see dependencies.md).
[patch.crates-io]
citationberg = { git = "https://github.com/typst/citationberg", rev = "06a591e2f237d25e1dfdedac3f3d1494c496c52d" }

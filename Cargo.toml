[workspace]
resolver = "2"
members = [
    "crates/gotipe-schema",
    "crates/gotipe-core",
    "crates/gotipe-crdt",
    "crates/gotipe-comments",
    "crates/gotipe-versioning",
    "crates/gotipe-ai",
    "crates/gotipe-export",
    "crates/gotipe-export-wasm",
    "crates/gotipe-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/veniameen/gotipe"
homepage = "https://gotipe.com"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wasm-bindgen = "0.2"
uuid = { version = "1.0", features = ["v4", "v7", "js"] }
zstd = { version = "0.13.4", features = ["wasm", "no_asm"] }
regex = { version = "1.11", default-features = false, features = ["std", "perf", "unicode-perl"] }

# Export
pdf-writer = "0.15.0"
harfrust = "0.15.0"
read-fonts = "0.46.0"
subsetter = "0.2.6"
unicode-bidi = "0.3.18"
unicode-segmentation = "1.13.3"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
zip = { version = "9.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ammonia = "4.2.5"

# Testing
criterion = "0.5"
proptest = "1.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[profile.bench]
opt-level = 3
lto = true

<figure class="at-figure" id="f30" data-section="New features">
  <figcaption class="at-figure-head">
    <span class="at-num">30</span>
    <h2 class="at-figure-title">Version history</h2>
    <p class="at-caption">
      Library panel: versions by day, with author, time, and how many words were added and removed; the page compares the chosen version with the current one block by block, with a rule in the margin: added, removed, changed. “Restore” answers with a toast with undo; on a phone the list and the comparison are two screens.
    </p>
  </figcaption>
  <!-- @frame frame=history view=notion w=1024 label="comparison with the current version" -->
  <div class="gotipe-history">
    <div class="gotipe-history-main">
      <div class="gotipe-version-head gotipe-history-head">
        <span class="gotipe-tool gotipe-history-back"><svg class="gt-icon"><use href="#i-chevron-left" /></svg></span
        ><span class="gotipe-review-title">Release 2.8</span
        ><span class="gotipe-history-facts"
          ><span class="gotipe-review-fact">November 10, 18:40</span
          ><span class="gotipe-diff-stat"><span class="is-add">+2</span> · <span class="is-del">−1</span> · <span class="is-change">1 changed</span></span></span
        ><span class="gotipe-tool-spacer"></span
        ><span class="gotipe-button is-primary"><svg class="gt-icon"><use href="#i-restore" /></svg>Restore</span>
      </div>
      <article class="gotipe-page is-scrolled" lang="en">
        <div class="gotipe-doc">
          <h3>Rollout order</h3>
          <p>The log is enabled in steps, each after a week of observation.</p>
          <ol class="gotipe-list">
            <li data-diff="changed">
              Enable the log for <span class="gotipe-delete">10%</span
              ><span class="gotipe-insert">5%</span> of web users.
            </li>
            <li>Compare the share of lost edits with the control group for a week.</li>
            <li data-diff="added">Open to everyone, starting with the macOS app.</li>
          </ol>
          <p data-diff="removed">Draft encryption comes after the release.</p>
          <p data-diff="added">The draft is encrypted with the session key from day one.</p>
          <p>We take objections until November 18, in the ADR-0031 discussion.</p>
        </div>
      </article>
    </div>
    <aside class="gotipe-panel" aria-label="History">
      <div class="gotipe-panel-head">

        <span class="gotipe-tool-spacer"></span>

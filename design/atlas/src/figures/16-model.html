<figure class="at-figure" id="f16" data-section="Collaboration and review">
  <figcaption class="at-figure-head">
    <span class="at-num">16</span>
    <h2 class="at-figure-title">Model: command bar and hint</h2>
    <p class="at-caption">
      The hint is quiet text after the cursor; Tab accepts it. The command bar sits at the bottom of
      the editor and knows what is selected; while the model writes, the bar shows it and lets you
      stop.
    </p>
  </figcaption>
  <!-- @frame frame=ghost view=notion w=768 label="hint text at the cursor" -->
  <article class="gotipe-page is-slice" lang="en">
    <div class="gotipe-doc">

      <p>
        The log lives in IndexedDB and survives an app restart. When the network returns,
        the editor<span class="gotipe-caret"></span><span class="gotipe-ghost">
          will send the log in one batch and wait for the new version<span class="gotipe-kbd">Tab</span></span
        >
      </p>
    </div>
  </article>
  <!-- @end -->

  </article>

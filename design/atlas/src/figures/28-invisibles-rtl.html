    <h2 class="at-figure-title">Невидимые символы и направление текста</h2>
    <p class="at-caption">
      Переключатель ¶ показывает невидимое тише текста: пробел — точкой, перенос строки — ↵, конец
      абзаца — ¶. Абзац справа налево идёт от правого края, и ручка блока стоит в правом поле — там,
      где строка начинается.
    </p>
  </figcaption>

        <p>Правка,<span class="gotipe-sp"> </span>сделанная<span class="gotipe-sp"> </span>без<span class="gotipe-sp"> </span>сети,<span class="gotipe-sp"> </span>сейчас<span class="gotipe-sp"> </span>пропадает,<span class="gotipe-sp"> </span>если<span class="gotipe-sp"> </span>закрыть<span class="gotipe-sp"> </span>вкладку<span class="gotipe-sp"> </span>до<span class="gotipe-sp"> </span>того,<span class="gotipe-sp"> </span>как<span class="gotipe-sp"> </span>связь<span class="gotipe-sp"> </span>вернётся.<span class="gotipe-br"></span><br />В<span class="gotipe-sp"> </span>выпуске<span class="gotipe-sp"> </span>2.8<span class="gotipe-sp"> </span>редактор<span class="gotipe-sp"> </span>пишет<span class="gotipe-sp"> </span>каждую<span class="gotipe-sp"> </span>транзакцию<span class="gotipe-sp"> </span>в<span class="gotipe-sp"> </span>журнал<span class="gotipe-sp"> </span>и<span class="gotipe-sp"> </span>отправит<span class="gotipe-sp"> </span>его,<span class="gotipe-sp"> </span>когда<span class="gotipe-sp"> </span>сеть<span class="gotipe-sp"> </span>появится.<span class="gotipe-pilcrow"></span></p>

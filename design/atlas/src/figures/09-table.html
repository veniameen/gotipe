<figure class="at-figure" id="f9" data-section="Interaction">
  <figcaption class="at-figure-head">
    <span class="at-num">9</span>
    <h2 class="at-figure-title">Table: rows, columns and the column menu</h2>
    <p class="at-caption">
      A column is added by a strip to the right of the table, a row by a strip under it; both show
      under the pointer and while the cursor is in the table, and scrolling doesn’t cover them. A
      row under the pointer has a handle with a menu on the left: row above, below, delete. A cell
      is a text field with no focus frame. A wide table scrolls sideways, the edge with hidden
      columns fades. The column type changes how cells look: code in mono, number to the right, yes
      / no as a mark.
    </p>
  </figcaption>

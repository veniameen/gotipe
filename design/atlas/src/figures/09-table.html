    <h2 class="at-figure-title">Таблица: строки, столбцы и меню столбца</h2>
    <p class="at-caption">
      Столбец добавляется полосой справа от таблицы, строка — полосой под ней; обе видны под
      указателем и пока курсор в таблице, а прокрутка их не закрывает. У строки под указателем
      слева — ручка с меню: строка выше, ниже, удалить. Ячейка — поле текста, рамки фокуса у неё
      нет. Широкая таблица прокручивается вбок, край со скрытыми столбцами затухает. Тип столбца
      меняет вид ячеек: код — моноширинным, число — вправо, да / нет — знаком.
    </p>
  </figcaption>

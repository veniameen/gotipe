<figure class="at-figure" id="f13" data-section="Collaboration and review">
  <figcaption class="at-figure-head">
    <span class="at-num">13</span>
    <h2 class="at-figure-title">Comments</h2>
    <p class="at-caption">
      Commented words are underlined in amber, the open one has a fill. The panel: open and
      resolved, a thread with a quote, a reply right in the card; ⌘↵ sends.
    </p>
  </figcaption>
  <!-- @frame frame=comments view=notion w=1024 label="comments panel" -->
  <div class="gotipe-with-panel">
    <article class="gotipe-page is-slice" lang="en">
      <div class="gotipe-doc">
        <h2>Conflicts</h2>
        <p>
          A conflict is resolved per block:
          <mark class="gotipe-comment-mark is-active">someone else’s edit to a block doesn’t
          overwrite yours</mark>; both versions stay, yours as a suggestion.
        </p>
        <p>
          If a block is deleted on the server, the author sees <mark class="gotipe-comment-mark">a
          “Block deleted” toast</mark>, and their version stays in the document history.
        </p>
        <p>If the whole document is deleted, the editor offers to restore it from “Drafts”.</p>
      </div>
    </article>
    <aside class="gotipe-panel">
      <div class="gotipe-panel-head">
        <p class="gotipe-panel-title">Comments</p>
        <span class="gotipe-seg"><span class="is-on">Open 2</span><span>Resolved 1</span></span>
      </div>
      <div class="gotipe-card is-open">
        <div class="gotipe-comment">
          <div class="gotipe-comment-head"><span class="gotipe-avatar" data-person="2">ML</span><span class="gotipe-comment-author">Maria Lebedeva</span><span class="gotipe-comment-time">10:42</span><span class="gotipe-comment-actions"><span class="gotipe-tool"><svg class="gt-icon"><use href="#i-resolve" /></svg></span><span class="gotipe-tool"><svg class="gt-icon"><use href="#i-more" /></svg></span></span></div>
          <p class="gotipe-comment-quote">someone else’s edit to a block doesn’t overwrite yours</p>
          <p class="gotipe-comment-body">
            What if a block was deleted and edited at the same time? What will the author see: the toast or a suggestion?
          </p>
        </div>
        <div class="gotipe-comment">
          <div class="gotipe-comment-head"><span class="gotipe-avatar" data-person="1">IO</span><span class="gotipe-comment-author">Ilya Orlov</span><span class="gotipe-comment-time">10:58</span></div>
          <p class="gotipe-comment-body">The toast. A deletion beats an edit, and the edit goes to history.</p>
        </div>
        <div class="gotipe-reply">
          <span class="gotipe-field is-typing"
            ><span class="gotipe-field-value">I’ll add this to the table<span class="gotipe-caret"></span></span
          ></span>
          <span class="gotipe-send"><svg class="gt-icon"><use href="#i-arrow-up" /></svg></span>
        </div>
      </div>
      <div class="gotipe-card">
        <div class="gotipe-comment-head"><span class="gotipe-avatar" data-person="1">IO</span><span class="gotipe-comment-author">Ilya Orlov</span><span class="gotipe-comment-time">yesterday</span></div>
        <p class="gotipe-comment-quote">a “Block deleted” toast</p>
        <p class="gotipe-comment-body">Agree the toast text with the interface editor.</p>
      </div>
    </aside>
  </div>

    <h2 class="at-figure-title">Таблица: объединённые ячейки</h2>
    <p class="at-caption">
      Ячейка занимает два столбца или две строки: черта под объединённым заголовком идёт только под
      его столбцами, объединённая ячейка прерывает черту между строками. Выделенные ячейки — в цвете
      выделения; «Объединить ячейки» и «Разделить ячейку» — в меню строки и столбца, недоступное —
      бледнее.
    </p>

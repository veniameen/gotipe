  <figcaption class="at-figure-head">
    <span class="at-num">21</span>
    <h2 class="at-figure-title">Documentation</h2>
    <p class="at-caption">
      Sections on the left, the page in the docs view in the middle (a GoTipe document), the outline on the right. The header
      sits on the page columns: the search field starts where the page does. Above the title, in one
      row, are the path and “Copy Markdown” with the edit-on-GitHub link (icons on a phone); under the description,
      the packages and the license. The page starts with a live example without a heading of its own, followed by
      installation (command and packages in code colors), code, commands and limits; links in the text
      are underlined. The navigation fades at its edges, the outline is labeled in mono like the sections; under
      the page is a footer row. Search on ⌘K: a page shows its description, a section shows “Page ·
      excerpt”. On a laptop the outline goes away; on a tablet and a phone the sections hide behind a menu
      button.
    </p>
  </figcaption>

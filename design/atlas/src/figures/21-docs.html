    <span class="at-num">21</span>
    <h2 class="at-figure-title">Документация</h2>
    <p class="at-caption">
      Слева разделы, в середине страница в виде docs — это документ GoTipe, справа оглавление. Шапка
      стоит на колонках страницы: поле поиска начинается там, где страница. Над заголовком в одной
      строке — путь и «Copy Markdown» с правкой на GitHub (на телефоне — значки), под описанием —
      пакеты и лицензия. Страница начинается с живого примера без отдельного заголовка, дальше
      установка (команда и пакеты в цветах кода), код, команды и ограничения; ссылки в тексте
      подчёркнуты. Навигация гаснет у своих краёв, оглавление подписано моно, как разделы; под
      страницей — строка подвала. Поиск по ⌘K: у страницы — её описание, у раздела — «Страница ·
      отрывок». На ноутбуке уходит оглавление, на планшете и телефоне разделы прячутся за кнопку
      меню.
    </p>
  </figcaption>

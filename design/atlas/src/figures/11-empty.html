<figure class="at-figure" id="f11" data-section="Interaction">
  <figcaption class="at-figure-head">
    <span class="at-num">11</span>
    <h2 class="at-figure-title">Hints in empty blocks and an empty page</h2>
    <p class="at-caption">
      An empty block says what it will become. A new page: the icon appears on hover, the cursor is
      in the title, quick blocks below (a proposal: the library doesn’t have them yet).
    </p>
  </figcaption>
  <!-- @frame frame=placeholders view=notion w=480 label="empty blocks" -->
  <article class="gotipe-page is-slice" lang="en">
    <div class="gotipe-doc">
      <h2 class="is-empty" data-placeholder="Heading"></h2>
      <p class="is-empty" data-placeholder="Type “/” for blocks"><span class="gotipe-caret"></span></p>
      <ul class="gotipe-list">
        <li class="is-empty" data-placeholder="List"></li>
      </ul>
      <ul class="gotipe-todo-list">
        <li class="gotipe-todo-item" data-checked="false">
          <span class="gotipe-check" role="checkbox" aria-checked="false"><svg class="gt-icon"><use href="#i-check" /></svg></span>
          <span class="gotipe-todo-item-content is-empty" data-placeholder="Task"></span>
        </li>
      </ul>
      <blockquote class="gotipe-quote"><p class="is-empty" data-placeholder="Quote"></p></blockquote>
    </div>
  </article>
  <!-- @end -->
  <!-- @frame frame=empty-page view=notion w=768 min=400 label="new page" -->
  <article class="gotipe-page" lang="en">
    <header class="gotipe-page-head">
      <span class="gotipe-icon-slot is-hover"><svg class="gt-icon"><use href="#i-smile" /></svg>Add icon</span>
      <h1 class="gotipe-page-title is-empty" data-placeholder="Untitled"><span class="gotipe-caret"></span></h1>
    </header>
    <div class="gotipe-doc">
      <div class="gotipe-starters">
        <span class="gotipe-button is-quiet"><svg class="gt-icon"><use href="#i-todo" /></svg>To-do list</span>
        <span class="gotipe-button is-quiet"><svg class="gt-icon"><use href="#i-table" /></svg>Table</span>
        <span class="gotipe-button is-quiet"><svg class="gt-icon"><use href="#i-code" /></svg>Code</span>
        <span class="gotipe-button is-quiet"><svg class="gt-icon"><use href="#i-image" /></svg>Image</span>
      </div>
    </div>
  </article>
  <!-- @end -->
</figure>

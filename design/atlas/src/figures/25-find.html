<figure class="at-figure" id="f25" data-section="New features">
  <figcaption class="at-figure-head">
    <span class="at-num">25</span>
    <h2 class="at-figure-title">Find and replace</h2>
    <p class="at-caption">
      The find bar sits in the editor’s top right corner: the query and “3 of 12”, match case, whole
      word, regular expression, previous, next, close; matches are highlighted, the current one
      stronger and outlined. Replace is a second row under the query, an empty search highlights the
      field; on a phone the tools go under the field.
    </p>
  </figcaption>
  <!-- @frame frame=find view=notion w=768 label="found" -->
  <div class="gotipe-overlay gotipe-find" role="search" aria-label="Search the document">
    <span class="gotipe-tool"><svg class="gt-icon"><use href="#i-chevron-right" /></svg></span>
    <span class="gotipe-field is-typing"
      ><span class="gotipe-field-value">log<span class="gotipe-caret"></span></span
      ><span class="gotipe-find-count">3 of 12</span></span
    >
    <span class="gotipe-find-tools"
      ><span class="gotipe-tool"><svg class="gt-icon"><use href="#i-case" /></svg></span
      ><span class="gotipe-tool is-hover"
        ><svg class="gt-icon"><use href="#i-word" /></svg
        ><span class="gotipe-tooltip" data-place="below">Whole word</span
        ><svg class="at-pointer"><use href="#i-pointer" /></svg></span
      ><span class="gotipe-tool"><svg class="gt-icon"><use href="#i-regex" /></svg></span
      ><span class="gotipe-tool-sep"></span
      ><span class="gotipe-tool"><svg class="gt-icon"><use href="#i-arrow-up" /></svg></span
      ><span class="gotipe-tool"><svg class="gt-icon"><use href="#i-arrow-down" /></svg></span
      ><span class="gotipe-tool"><svg class="gt-icon"><use href="#i-x" /></svg></span></span
    >
  </div>
  <article class="gotipe-page is-slice" lang="en">
    <div class="gotipe-doc">
      <h2>How it works</h2>
      <p>
        Every transaction first goes into the <mark class="gotipe-match">log</mark> and only then to
        the server. When the connection is back, the <mark class="gotipe-match">log</mark> goes out
        as a batch and the server answers with a new version of the document.
      </p>
      <p>
        The <mark class="gotipe-match is-current">log</mark> lives in IndexedDB and survives an app
        restart. The server accepts a batch of transactions whole or rejects it; the <mark
        class="gotipe-match">log</mark> is not cleared in that case.
      </p>
      <p>The <mark class="gotipe-match">log</mark> schema and migration are described in ADR-0031.</p>
    </div>
  </article>
  <!-- @end -->

    <h2 class="at-figure-title">Suggested edits</h2>
    <p class="at-caption">
      An insertion is underlined in the author's color, a deletion is struck through. Above the page:
      who is editing, how many are waiting, "Accept all". The card sits by the text: the reason and
      two answers; a stale one has only "Reject". A comment's card can be deleted from the end of its
      head. Host options: on a narrow page the card opens above the row instead of below it; a lane's cursor
      is an arrow pointer with its name instead of a caret with a flag. A proposal still being written
      shows what is written so far and has no answers yet; a lane has a cursor for each text it
      writes, named by the host, and a host can end the growing text with a typing caret. At the
      page's edge a flag that has no room after its cursor stands before it, above the row. After
      inline code the caret stands inside the code's plate, just after its last letter, on the
      text's row, and the cursor with it. A suggested table stays a table: its cells square under the author's tint, a head fill kept
      under it, and a row being written stands under it as any block after a table (before 0.1.5
      the cells were rounded, lost their fill, and the row stood close under the table).
    </p>
  </figcaption>

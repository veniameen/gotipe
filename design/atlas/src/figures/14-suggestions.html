<figure class="at-figure" id="f14" data-section="Collaboration and review">
  <figcaption class="at-figure-head">
    <span class="at-num">14</span>
    <h2 class="at-figure-title">Suggested edits</h2>
    <p class="at-caption">
      An insertion is underlined in the author's color, a deletion is struck through. Above the page:
      who is editing, how many are waiting, "Accept all". The card sits by the text: the reason and
      two answers; a stale one has only "Reject". A comment's card can be deleted from the end of its
      head. Host option: on a narrow page the card opens above the row instead of below it.
    </p>
  </figcaption>
  <!-- @frame frame=suggestions view=notion w=1024 label="model suggestions" -->
  <div class="gotipe-review-bar"><svg class="gt-icon"><use href="#i-sparkle" /></svg><span class="gotipe-review-title">AI suggestions</span
      ><span class="gotipe-review-fact">3 suggestions</span
      ><span class="gotipe-review-fact is-stale">1 stale</span
      ><span class="gotipe-tool-spacer"></span><span class="gotipe-button is-quiet">Reject all</span
      ><span class="gotipe-button is-primary">Accept all</span></div>
  <div class="gotipe-with-margin">
    <article class="gotipe-page is-slice" lang="en">
      <div class="gotipe-doc">
        <p>
          An edit made offline
          <span class="gotipe-delete" data-person="3">currently disappears</span
          ><span class="gotipe-insert" data-person="3">is lost</span> if the tab is closed before
          the connection comes back.
        </p>
        <h3>Rollout order</h3>
        <ol class="gotipe-list">
          <li>Turn the log on for 5% of web users.</li>
          <li>
            Compare the share of lost edits with the control group for a week<span
              class="gotipe-insert"
              data-person="1"
              >: threshold — under 0.1%</span
            >.
          </li>
          <li>
            Open to everyone, starting with the macOS app<span class="gotipe-insert is-stale" data-person="3">
              and iPadOS</span
            >.
          </li>
        </ol>
      </div>
    </article>
    <div class="gotipe-margin">
      <div class="gotipe-card is-open">
        <div class="gotipe-comment-head"><span class="gotipe-lane" data-person="3"><svg class="gt-icon"><use href="#i-sparkle" /></svg></span><span class="gotipe-comment-author">AI</span><span class="gotipe-comment-time">replacement</span></div>
        <p class="gotipe-card-note">“Is lost” is more precise: the edit doesn’t vanish at once, but it can’t be recovered.</p>
        <div class="gotipe-card-actions">
          <span class="gotipe-button is-quiet">Reject</span><span class="gotipe-button is-primary">Accept</span>
        </div>
      </div>
      <div class="gotipe-card">
        <div class="gotipe-comment-head"><span class="gotipe-lane" data-person="1"><svg class="gt-icon"><use href="#i-check-16" /></svg></span><span class="gotipe-comment-author">Style check</span><span class="gotipe-comment-time">insertion</span></div>
        <p class="gotipe-card-note">The rollout plan needs a measurable threshold.</p>
      </div>
    </div>
  </div>
  <!-- @end -->
  <!-- @frame frame=suggestion-stale view=notion w=1024 label="stale one and a model question" -->
  <div class="gotipe-with-margin">
    <article class="gotipe-page is-slice" lang="en">
      <div class="gotipe-doc">
        <ol class="gotipe-list">
          <li>Compare the share of lost edits with the control group for a week.</li>
          <li>
            Open to everyone, starting with the macOS app and Windows<span
              class="gotipe-insert is-stale"
              data-person="3"
            >
              and iPadOS</span
            >.
          </li>
        </ol>
        <p>We take objections until November 18, in the ADR-0031 discussion.</p>
      </div>
    </article>
    <div class="gotipe-margin">
      <div class="gotipe-card is-open">
        <div class="gotipe-comment-head"><span class="gotipe-lane" data-person="3"><svg class="gt-icon"><use href="#i-sparkle" /></svg></span><span class="gotipe-comment-author">AI</span><span class="gotipe-tag">stale</span></div>
        <p class="gotipe-card-note">The text around changed — the edit can’t be applied.</p>
        <div class="gotipe-change">
          <span class="gotipe-change-label">Before</span>
          <span class="gotipe-delete">Open to everyone, starting with the macOS app.</span>
          <span class="gotipe-change-label">After</span>
          <span>Open to everyone, starting with the macOS app and iPadOS.</span>
        </div>
        <div class="gotipe-card-actions"><span class="gotipe-button">Reject</span></div>
      </div>
      <div class="gotipe-card">
        <div class="gotipe-comment-head"><span class="gotipe-lane" data-person="3"><svg class="gt-icon"><use href="#i-sparkle" /></svg></span><span class="gotipe-comment-author">AI</span><span class="gotipe-comment-time">Waiting for your reply</span><span class="gotipe-card-delete"><svg class="gt-icon"><use href="#i-trash" /></svg></span></div>
        <p class="gotipe-comment-body">Is the 0.1% threshold of all edits or only of offline edits?</p>
        <div class="gotipe-reply">
          <span class="gotipe-field"><span class="gotipe-field-placeholder">Reply…</span></span>
          <span class="gotipe-send" aria-disabled="true"><svg class="gt-icon"><use href="#i-arrow-up" /></svg></span>
        </div>
      </div>
    </div>
  </div>
  <!-- @end -->
</figure>

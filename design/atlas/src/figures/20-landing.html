<figure class="at-figure" id="f20" data-section="Site">
  <figcaption class="at-figure-head">
    <span class="at-num">20</span>
    <h2 class="at-figure-title">Home page</h2>
    <p class="at-caption">
      The home page after the owner's reference (zydeo-web), in GoTipe's voice. The first screen's
      backdrop is inset from the window edge equally on all sides. On the site, at the sides of the
      first screen there is a nebula: a soft blue gas frames the text and drifts barely noticeably,
      with rare stars twinkling on top. The cursor lights up the gas near it and swirls it slightly,
      the stars shift a little after it, as if in depth. Under the text and the header the nebula
      quiets down, and below the first screen it fades out. The frame draws the light of the first
      screen without it. Under the nebula, at the sides, lies the editor itself: the block menu, the
      Markdown source, a table, a discussion, versions, the formatting toolbar, a collaborator's
      cursor; it is invisible until the cursor lifts it out in a soft circle of light that follows
      the mouse smoothly. The large headings are lit: the ink turns into deep blue (on dark, white
      into ice), the accent line goes from the accent to light blue. The main button is, on a dark
      page, a gray pill with a soft white light inside, on a light one an ink pill with a cold light
      blue light; the light sits at the end of the pill, on the site it follows the cursor smoothly
      and stays where the cursor left, and the pill's edge burns at the light: a thin line and a
      glow blurred by 2, 7 and 15 px (on a light page, a thin blue line with almost no blur). The
      second button is dark glass with an outline (on a light page, a white pill with a neutral
      outline and a soft shadow); when the lamp comes close to its side, the second button's near
      edge catches the light. Button labels are small caps. The header is a strip across the whole
      frame, transparent over the first screen, its quiet links a step darker than the page's quiet
      text; the theme changes with one press, the new one unfolds in a circle from the button, and on
      a phone it is a switch in the menu. When the page starts to scroll, the header's glass
      smoothly shrinks exactly to the page column: its edges meet the column's edges and do not go
      beyond them, while the mark, links and buttons move inside the glass, all on one middle line
      (the third frame). "rules." is highlighted as in the editor, with a caret blinking after it;
      the live window is Markdown on the left, the document on the right, a beam runs along the edge;
      both sides can be edited: an edit in the document is written to Markdown at once, and typed
      Markdown is accepted by the document after a pause; the block under the cursor has "+" and a
      handle in the document's left margin; on a phone the window is switched by "Document" and
      "Markdown". Next: facts that count up when they appear; the stack is a panel in the page's
      theme (light glass and white nodes by day, night ones by night): your interface and your
      infrastructure, the engine's light raises a grain of dots around it, a light runs along its
      edge; comets run along the rays, blue into the engine and light blue out of it, a node flashes
      when its comet leaves or arrives and the engine responds; a node or the engine under the
      cursor lights its rays; in the "Everything you need" heading a collaborator is at work: her
      caret with a name, a selected phrase and the editor toolbar above it; thin lines of light run
      along the page's left margin, light runs along two of them; the bento is three tiles in the
      page's theme with drawn marks (an engine chip, M↓, two people), the light lies behind and
      passes into the gaps between them, in each tile it glows at the near corner through a grain of
      dots; the nine parts of the stack are open cells: a drawn gradient mark, a large name, the
      license beside it, light under the pointer; the view switcher with a slider above a window of
      one height; a dark panel with examples in tabs for React, Markdown and Vue; three ways to get
      started with drawn marks (browser, chip, cloud); licenses of one height; the closing strip is
      the first screen's light in the page's theme: on the left a document built on the engine,
      glass plates in depth, below the engine with a slope from the logo (white by day, a silhouette
      in the engine's light by night), above it the Markdown source, blocks and a page with a
      selection, a caret and a collaborator's flag; the light rises through them, the plates breathe
      slowly; on the right the words and two buttons. Spacing uses steps of the 4 px scale
      (--site-space-*), corners use the --site-radius-* steps. The frame draws the rest that motion
      comes into; with prefers-reduced-motion there is no motion. Numbers are from tree 72271ce: 949
      scenarios pass in all three browsers (965 in Chromium), the core with Markdown is 127,296
      bytes gzip, WASM is 300,183. Without a Playground address the second button leads to GitHub
      ("View on GitHub").
    </p>

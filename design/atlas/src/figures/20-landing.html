<figure class="at-figure" id="f20" data-section="Сайт">
  <figcaption class="at-figure-head">
    <span class="at-num">20</span>
    <h2 class="at-figure-title">Главная страница</h2>
    <p class="at-caption">
      Главная по образцу владельца (zydeo-web) голосом GoTipe. Подложка первого экрана отстоит от
      края окна одинаково со всех сторон; шапка — полоса в той же рамке: прозрачная над первым
      экраном, стеклянная после прокрутки, знак, ссылки и кнопки стоят на одной средней линии и на
      краях колонки страницы. «rules.» выделено, как в редакторе, за ним мигает каретка; живое окно —
      Markdown слева, документ справа, по краю бежит луч; на телефоне окно переключает «Document» и
      «Markdown». Дальше: факты, которые досчитываются при появлении; стек — ваш интерфейс и ваша
      инфраструктура, по лучам между ними и движком бегут импульсы; бенто с живыми картинками и
      девять частей стека, под указателем — свет; переключатель видов с ползунком над окном одной
      высоты; тёмная панель с примерами во вкладках React, Markdown и Vue; три способа запуска;
      лицензии одной высоты; финальная полоса. Отступы — шаги шкалы 4 px (--site-space-*), углы —
      шаги --site-radius-*. Кадр рисует покой, в который приходит движение; при
      prefers-reduced-motion движения нет. Числа — дерево 72271ce: 949 сценариев проходят во всех
      трёх браузерах (965 в Chromium), ядро с Markdown — 127 296 байт gzip, WASM — 300 183. Без
      адреса Playground вторая кнопка ведёт на GitHub («View on GitHub»).
    </p>

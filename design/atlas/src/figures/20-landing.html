    <h2 class="at-figure-title">Главная страница</h2>
    <p class="at-caption">
      Главная по образцу владельца (zydeo-web) голосом GoTipe. Подложка первого экрана отстоит от
      края окна одинаково со всех сторон. На сайте по сторонам первого экрана — туманность: мягкий
      синий газ обрамляет текст и едва заметно дрейфует, поверх мерцают редкие звёзды. Курсор
      подсвечивает газ рядом с собой и слегка его закручивает, звёзды чуть сдвигаются за ним, как в
      глубине. Под текстом и шапкой туманность затихает, ниже первого экрана гаснет. Кадр рисует
      свет первого экрана без неё. Под туманностью по сторонам лежит сам редактор — меню блоков,
      исходник Markdown, таблица, обсуждение, версии, панель форматирования, курсор соавтора; он
      невидим, пока курсор не поднимет его в мягком круге света, который плавно идёт за мышью.
      Большие заголовки освещены: чернила переходят в глубокий синий (на тёмном — белый в лёд),
      строка акцента — из акцента в голубой. Главная кнопка — на тёмной странице серая пилюля с
      мягким белым светом внутри, на светлой — чернильная пилюля с холодным голубым светом; он стоит
      у конца пилюли, на сайте плавно идёт за курсором и остаётся там, где курсор ушёл, а край
      пилюли у света горит: тонкая линия и свет, размытый на 2, 7 и 15 px (на светлой странице —
      тонкая синяя линия почти без размытия). Вторая кнопка — тёмное стекло в обводке (на светлой
      странице — белая пилюля в нейтральной обводке с мягкой тенью); когда лампа подходит к её
      стороне, ближний край второй кнопки ловит свет. Подписи кнопок — малые прописные. Шапка —
      полоса во всю рамку, прозрачная над первым экраном, её тихие ссылки на ступень темнее тихого
      текста страницы; тема меняется одним нажатием, новая раскрывается кругом от кнопки, на
      телефоне — переключатель в меню. Когда страница начинает прокручиваться, стекло шапки плавно
      сжимается ровно до колонки страницы — его края встают на края колонки и не выходят за них, а
      знак, ссылки и кнопки отходят внутрь стекла, все на одной средней линии (третий кадр).
      «rules.» выделено, как в редакторе, за ним мигает каретка; живое окно — Markdown слева,
      документ справа, по краю бежит луч; править можно обе стороны: правка документа сразу пишется
      в Markdown, набранный Markdown документ принимает на паузе; у блока под курсором в левом поле
      документа стоят «+» и ручка; на телефоне окно переключает «Document» и «Markdown». Дальше:
      факты, которые досчитываются при появлении; стек — панель в теме страницы (днём светлое стекло
      и белые узлы, ночью — ночная): ваш интерфейс и ваша инфраструктура, свет движка поднимает
      зерно точек вокруг него, по его краю бежит свет; по лучам бегут кометы — синие в движок,
      голубые из него, — узел вспыхивает, когда его комета уходит или приходит, движок отзывается;
      узел или движок под курсором зажигает свои лучи; в заголовке «Everything you need» работает
      соавтор — её каретка с именем, выделенная фраза и панель редактора над ней; по левому полю
      страницы идут тонкие световые линии, по двум бежит свет; бенто — три плитки в теме страницы с
      нарисованными знаками (чип движка, M↓, двое), сзади лежит свет и проходит в зазоры между ними,
      в каждой плитке он светится у ближнего угла сквозь зерно точек; девять частей стека — открытые
      ячейки: нарисованный градиентный знак, крупное имя, лицензия рядом, под указателем — свет;
      переключатель видов с ползунком над окном одной высоты; тёмная панель с примерами во вкладках
      React, Markdown и Vue; три способа запуска с нарисованными знаками (браузер, чип, облако);
      лицензии одной высоты; финальная полоса — свет первого экрана в теме страницы: слева документ,
      собранный на движке, — стеклянные пластины в глубину, снизу движок со скатом из логотипа (днём
      белым, ночью — силуэтом на свету движка), над ним исходник Markdown, блоки и страница с
      выделением, кареткой и флажком соавтора; свет поднимается сквозь них, пластины медленно дышат;
      справа слова и две кнопки. Отступы — шаги шкалы 4 px (--site-space-*), углы — шаги
      --site-radius-*. Кадр рисует покой, в который приходит движение; при prefers-reduced-motion
      движения нет. Числа — дерево 72271ce: 949 сценариев проходят во всех трёх браузерах (965 в
      Chromium), ядро с Markdown — 127 296 байт gzip, WASM — 300 183. Без адреса Playground вторая
      кнопка ведёт на GitHub («View on GitHub»).
    </p>

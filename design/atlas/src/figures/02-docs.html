    <h2 class="at-figure-title">Вид docs</h2>
    <p class="at-caption">
      Справочная страница: текст плотнее, 14/22; оглавление рядом и уходит на узком экране; номера
      строк в коде. Ручка блока — как в notion: у блока под указателем, в поле 64 между оглавлением
      и текстом. Якорь # — после последнего слова заголовка под указателем; место под него заголовок
      держит всегда, поэтому не переносится заново; щелчок копирует ссылку на заголовок. На узком
      экране ручка остаётся в поле 56, как у notion в библиотеке; якорь — у заголовка, которого
      коснулись. Кадры «вариант» — к решению D-30: невыбранный уйдёт.
    </p>
  </figcaption>

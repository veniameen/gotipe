    <h2 class="at-figure-title">The docs view</h2>
    <p class="at-caption">
      A reference page: denser text, 14/22; the outline sits beside it and goes away on a narrow
      screen; line numbers in code. The block handle works as in notion: by the block under the
      pointer, in a 64 margin between the outline and the text. The # anchor comes after the last
      word of the heading under the pointer; the heading always keeps room for it, so it does not
      rewrap; a click copies the link, and the host builds the address. On a narrow screen the
      handle stays in a 56 margin and the anchor sits by the heading that was touched. Accepted
      November 15 (D-30).
    </p>
  </figcaption>

<figure class="at-figure" id="f18" data-section="Blocks">
  <figcaption class="at-figure-head">
    <span class="at-num">18</span>
    <h2 class="at-figure-title">Tasks, toggles, file, embed and formula</h2>
    <p class="at-caption">
      The checkbox border is one whole pixel on any screen; it darkens under the pointer. An empty
      to-do and an empty toggle say what they will become. File actions appear under the pointer. An
      embed without a link asks for one; with a link it is a page card. A formula shows TeX as
      written; the host can render it.
    </p>
  </figcaption>
  <!-- @frame frame=tasks view=notion w=480 label="tasks" -->
  <article class="gotipe-page is-slice" lang="en">
    <div class="gotipe-doc">
      <h2>Tasks</h2>
      <ul class="gotipe-todo-list">
        <li class="gotipe-todo-item" data-checked="true">
          <span class="gotipe-check" role="checkbox" aria-checked="true"><svg class="gt-icon"><use href="#i-check" /></svg></span>
          <span class="gotipe-todo-item-content">Encrypt the draft with the session key</span>
        </li>
        <li class="gotipe-todo-item" data-checked="false">
          <span class="gotipe-check is-hover" role="checkbox" aria-checked="false"
            ><svg class="gt-icon"><use href="#i-check" /></svg
            ><svg class="at-pointer"><use href="#i-pointer" /></svg
          ></span>
          <span class="gotipe-todo-item-content">“Unsent” indicator in the page header</span>
        </li>
        <li class="gotipe-todo-item" data-checked="false">
          <span class="gotipe-check" role="checkbox" aria-checked="false"><svg class="gt-icon"><use href="#i-check" /></svg></span>
          <span class="gotipe-todo-item-content">Lost-edit metric on the release dashboard</span>
        </li>
        <li class="gotipe-todo-item" data-checked="false">
          <span class="gotipe-check" role="checkbox" aria-checked="false"><svg class="gt-icon"><use href="#i-check" /></svg></span>
          <span class="gotipe-todo-item-content is-empty" data-placeholder="To-do"></span>
        </li>
      </ul>
    </div>
  </article>
  <!-- @end -->
  <!-- @frame frame=toggles view=notion w=480 label="toggles" -->
  <article class="gotipe-page is-slice" lang="en">
    <div class="gotipe-doc">
      <details class="gotipe-toggle" open>
        <summary>
          <span class="gotipe-toggle-button"><svg class="gt-icon"><use href="#i-chevron-down" /></svg></span>
          <span>Why not Background Sync</span>
        </summary>
        <div class="gotipe-toggle-content">
          <p>Safari doesn’t have it, while a log in IndexedDB works the same everywhere.</p>
        </div>
      </details>
      <details class="gotipe-toggle">
        <summary>
          <span class="gotipe-toggle-button is-focus-visible"><svg class="gt-icon"><use href="#i-chevron-right" /></svg></span>
          <span>What happens to attachments</span>
        </summary>
      </details>
      <details class="gotipe-toggle">
        <summary>
          <span class="gotipe-toggle-button"><svg class="gt-icon"><use href="#i-chevron-right" /></svg></span>
          <span class="is-empty" data-placeholder="Toggle"></span>
        </summary>
      </details>
    </div>
  </article>
  <!-- @end -->
  <!-- @frame frame=file view=notion w=480 label="file" -->
  <article class="gotipe-page is-slice" lang="en">
    <div class="gotipe-doc">
      <div class="gotipe-file">
        <span class="gotipe-card-icon"><svg class="gt-icon"><use href="#i-file" /></svg></span>
        <span class="gotipe-card-main"
          ><span class="gotipe-card-title">Log schema, v3.pdf</span
          ><span class="gotipe-card-meta">482.1 KB</span></span
        >
        <span class="gotipe-card-actions"
          ><span class="gotipe-card-action">Replace</span><span class="gotipe-card-action">Delete</span></span
        >
      </div>
      <div class="gotipe-file is-hovered">
        <span class="gotipe-card-icon"><svg class="gt-icon"><use href="#i-file" /></svg></span>
        <span class="gotipe-card-main"
          ><span class="gotipe-card-title">Support requests, October.xlsx</span
          ><span class="gotipe-card-meta">1.4 MB</span></span
        >
        <span class="gotipe-card-actions"
          ><span class="gotipe-card-action is-hover"
            >Replace<svg class="at-pointer"><use href="#i-pointer" /></svg></span
          ><span class="gotipe-card-action">Delete</span></span
        >
      </div>
    </div>
  </article>
  <!-- @end -->
  <!-- @frame frame=embed view=notion w=480 label="embed" -->
  <article class="gotipe-page is-slice" lang="en">
    <div class="gotipe-doc">
      <div class="gotipe-embed is-hovered">
        <span class="gotipe-card-icon"><svg class="gt-icon"><use href="#i-link" /></svg></span>
        <span class="gotipe-card-main"
          ><span class="gotipe-card-title">figma.com</span
          ><span class="gotipe-card-meta">figma.com/design/k2Lw/Offline drafts</span></span
        >
        <span class="gotipe-card-actions"
          ><span class="gotipe-card-action is-icon"><svg class="gt-icon"><use href="#i-external" /></svg></span
        ></span>
      </div>
      <div class="gotipe-embed">
        <span class="gotipe-card-icon"><svg class="gt-icon"><use href="#i-link" /></svg></span>
        <span class="gotipe-embed-field">Link to a page, video or mockup</span>
        <span class="gotipe-button is-primary">Insert</span>
      </div>
    </div>
  </article>
  <!-- @end -->
  <!-- @frame frame=math view=notion w=480 label="formula" -->
  <article class="gotipe-page is-slice" lang="en">
    <div class="gotipe-doc">
      <p>The share of lost edits is counted over a week:</p>
      <div class="gotipe-math">
        <div class="gotipe-code-block-header"><span>Formula · TeX</span></div>
        <pre class="gotipe-math-source">p = \frac{lost}{lost + sent}</pre>
      </div>
      <p>The release goal is under 0.1%.</p>
    </div>
  </article>
  <!-- @end -->
</figure>

<figure class="at-figure" id="f18" data-section="Блоки">
  <figcaption class="at-figure-head">
    <span class="at-num">18</span>
    <h2 class="at-figure-title">Задачи, раскрывающиеся блоки, файл, вставка и формула</h2>
    <p class="at-caption">
      Рамка флажка — целый пиксель на любом экране; под указателем она темнеет. Пустые задача и
      раскрывающийся блок говорят, чем станут. Действия файла появляются под указателем. Вставка
      без ссылки просит её, со ссылкой — карточка страницы. Формула показывает TeX как написан,
      нарисовать её может хост.
    </p>
  </figcaption>

        </li>
        <li class="gotipe-todo-item" data-checked="false">

        </li>
        <li class="gotipe-todo-item" data-checked="false">

        <li class="gotipe-todo-item" data-checked="false">

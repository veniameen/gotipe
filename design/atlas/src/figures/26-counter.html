<figure class="at-figure" id="f26" data-section="New features">
  <figcaption class="at-figure-head">
    <span class="at-num">26</span>
    <h2 class="at-figure-title">Word and character counter</h2>
    <p class="at-caption">
      A quiet line under the document: words and characters. If the host sets a limit, near the edge
      the character count takes a warning tone, past the edge an error tone: the extra text is
      highlighted in place, the reason for the limit is in a tooltip.
    </p>
  </figcaption>

      <h3>Rollout order</h3>
      <ol class="gotipe-list">
        <li>Turn the log on for 5% of web users.</li>
        <li>Compare the share of lost edits with the control group for a week.</li>
        <li>Open to everyone, starting with the macOS app.</li>
      </ol>
      <p>We take objections until November 18, in the ADR-0031 discussion or in the release 2.8 thread.</p>
    </div>

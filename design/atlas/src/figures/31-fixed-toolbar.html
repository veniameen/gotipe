    <h2 class="at-figure-title">Закреплённая панель</h2>
    <p class="at-caption">
      Панель над документом для вида modern. Включённое — на заливке, у недоступного причина — в
      подсказке. Что не поместилось, уходит в «Ещё»: сначала ¶, шрифт и размер, затем вставка,
      выравнивание с задачами и остальная разметка. История, тип блока, жирный, курсив,
      подчёркивание и списки остаются.
    </p>

      <div class="gotipe-doc">
        <p>
          Правка, сделанная без сети, сейчас пропадает, если закрыть вкладку до того, как связь
          вернётся. В выпуске 2.8 редактор пишет каждую транзакцию в локальный журнал, а сервер
          принимает <strong class="gotipe-selection">пачку целиком или отклоняет её</strong>.
        </p>
        <h3>Порядок выката</h3>
        <ol class="gotipe-list">
          <li>Включить журнал для 5 % пользователей веб-версии.</li>
          <li>Неделю сравнивать долю потерянных правок с контрольной группой.</li>
          <li>Открыть всем, начиная с приложения для macOS.</li>
        </ol>
      </div>

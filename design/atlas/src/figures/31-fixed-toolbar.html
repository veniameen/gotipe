    <span class="at-num">31</span>
    <h2 class="at-figure-title">Fixed toolbar</h2>
    <p class="at-caption">
      A bar over the document for the modern view. What is on sits on a fill; an unavailable tool gives its reason in the tooltip. What does not fit goes under “More”: first ¶, font and size, then insert, alignment with tasks, and the rest of the markup. History, block type, bold, italic, underline and lists stay.
    </p>

      <!-- @include content/drafts/head-plain.html -->
      <div class="gotipe-doc">
        <p>
          An edit made offline is currently lost if the tab is closed before the connection returns. In release 2.8 the editor writes every transaction to a local log, and the server accepts <strong class="gotipe-selection">a whole batch or rejects it</strong>.
        </p>
        <h3>Rollout order</h3>
        <ol class="gotipe-list">
          <li>Enable the log for 5% of web users.</li>
          <li>Compare the share of lost edits with the control group for a week.</li>
          <li>Open to everyone, starting with the macOS app.</li>
        </ol>
      </div>
    </article>

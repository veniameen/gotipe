<figure class="at-figure" id="f8" data-section="Interaction">
  <figcaption class="at-figure-head">
    <span class="at-num">8</span>
    <h2 class="at-figure-title">Handle, block menu, drag</h2>
    <p class="at-caption">
      The handle appears by the block under the pointer and doesn’t shift the text. The menu is in
      groups, the block type opens to the right with keys. While dragging, the block leaves a trace,
      a line shows the place, the ghost follows the pointer.
    </p>
  </figcaption>
  <!-- @frame frame=block-menu view=notion w=768 min=480 label="block menu" -->
  <article class="gotipe-page is-slice" lang="en">
    <div class="gotipe-doc">
      <h2>What changes</h2>
      <p class="is-hovered">
        Every transaction first goes into the log and only then to the server. When the connection
        is back, the log goes out as a batch and the server answers with a new version of the
        document.

          ><span class="gotipe-handle-button"><svg class="gt-icon"><use href="#i-plus" /></svg></span
          ><span class="gotipe-handle-button is-active"

        >
      </p>
      <p>
        A conflict is resolved per block: someone else’s edit to a block doesn’t overwrite yours;
        both versions stay, yours as a suggestion.
      </p>
    </div>
  </article>
  <!-- @end -->
  <!-- @frame frame=drag view=notion w=768 min=480 label="drag" -->
  <article class="gotipe-page is-slice" lang="en">
    <div class="gotipe-doc is-dragging">
      <p>
        The log lives in <code class="gotipe-inline-code">IndexedDB</code> and survives an app
        restart.
      </p>
      <div class="gotipe-callout is-drag-source" data-variant="warning">
        <span class="gotipe-callout-icon"><svg class="gt-icon"><use href="#i-warning" /></svg></span>
        <div class="gotipe-callout-content">
          <p>Before release 2.9 a draft doesn’t move between devices.</p>
        </div>
      </div>
      <p>The server accepts a batch of transactions whole or rejects it.</p>
      <h3 class="has-drop-before">Rollout order</h3>
      <ol class="gotipe-list">
        <li>Turn the log on for 5% of web users.</li>
        <li>Compare the share of lost edits with the control group for a week.</li>
      </ol>
      <div class="gotipe-drag-ghost" aria-hidden="true">
        <div class="gotipe-callout" data-variant="warning">

          <div class="gotipe-callout-content">
            <p>Before release 2.9 a draft doesn’t move between devices.</p>
          </div>
        </div>
        <svg class="at-pointer is-grab"><use href="#i-pointer" /></svg>
      </div>
    </div>
  </article>

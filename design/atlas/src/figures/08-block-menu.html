  <figcaption class="at-figure-head">

    <h2 class="at-figure-title">Ручка, меню блока, перетаскивание</h2>
    <p class="at-caption">
      Ручка появляется у блока под указателем и не сдвигает текст. Меню — группами, тип блока
      раскрывается справа с клавишами. При перетаскивании блок оставляет след, линия показывает
      место, призрак идёт за указателем.
    </p>
  </figcaption>

        вернулась, журнал уходит пачкой, а сервер отвечает новой версией документа.

      <p>
        Конфликт решается по блокам: чужая правка блока не перезаписывает вашу, обе версии

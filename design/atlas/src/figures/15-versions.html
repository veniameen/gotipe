<figure class="at-figure" id="f15" data-section="Collaboration and review">

    <h2 class="at-figure-title">Versions</h2>
    <p class="at-caption">
      The version list sits next to the page, and the page shows what changed since the chosen one.
      Today the library has versions without a UI; the frame proposes the panel from the playground
      example.
    </p>

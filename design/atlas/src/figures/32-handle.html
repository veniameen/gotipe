    <h2 class="at-figure-title">A handle where the frames did not draw it</h2>
    <p class="at-caption">
      A proposal, awaiting the owner’s decision (D-260–D-263, D-269). On a narrow screen the notion handle stays (docs/18): the left margin is 56, the handle sits in it to the left of the task checkbox and the list marker, and the table row handle is there too. For a three-digit number the list gives one digit more room, so the number does not reach the handle. Without a block handle, in minimal and modern, the row handle lacks room in the page margin: the first column gives it what is missing. For a block with no text of its own the handle stands at the first line of what it starts with: the top edge of an image, the file name, the table header.
    </p>
  </figcaption>

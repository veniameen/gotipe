    <h2 class="at-figure-title">Страница вики: PageEditor в общем виде</h2>
    <p class="at-caption">
      PageEditor собран из BlockEditor: та же панель, «/», ручка и меню блока, меню столбца; сверху

      передаёт в view.
    </p>

  <article class="gotipe-page" lang="ru">
    <header class="gotipe-page-head"><h1 class="gotipe-page-title">Офлайн-черновики</h1></header>
    <div class="gotipe-doc">
      <p>
        Правка, сделанная без сети,
        <span class="gotipe-delete" data-person="3">сейчас пропадает</span
        ><span class="gotipe-insert" data-person="3">теряется</span>, если закрыть вкладку до
        того, как связь вернётся. Решение опирается на ADR-0031.
      </p>
      <h2>Как это работает</h2>
      <p>
        Журнал лежит в <code>IndexedDB</code> и переживает перезапуск приложения. Сервер принимает
        пачку транзакций целиком или отклоняет её.
      </p>
      <h2>Порядок выката</h2>
      <ol class="gotipe-list">
        <li>Включить журнал для 5 % пользователей веб-версии.</li>
        <li>
          Неделю сравнивать долю потерянных правок с контрольной группой<span
            class="gotipe-insert"
            data-person="1"
            >: порог — меньше 0,1 %</span
          >.
        </li>
      </ol>
      <h2>Что не трогаем</h2>
      <pre class="gotipe-raw">&lt;details&gt;
  &lt;summary&gt;Журнал в цифрах&lt;/summary&gt;
  1 284 транзакции в очереди
&lt;/details&gt;</pre>
    </div>
  </article>

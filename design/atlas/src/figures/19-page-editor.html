<figure class="at-figure" id="f19" data-section="PageEditor">
  <figcaption class="at-figure-head">
    <span class="at-num">19</span>
    <h2 class="at-figure-title">Wiki page: PageEditor in general view</h2>
    <p class="at-caption">
      PageEditor is assembled from BlockEditor: the same toolbar, "/", block handle and block menu,
      column menu; on top, lossless Markdown and model suggestions. There is no page theme anymore.
      The title is the first "#" of the file. The default view is notion (owner decision, November
      12); the host passes docs and the others in view.
    </p>
  </figcaption>
  <!-- @frame frame=page-notion view=notion w=1024 h=760 label="default is notion" -->
  <div class="gotipe-review-bar"><svg class="gt-icon"><use href="#i-sparkle" /></svg><span class="gotipe-review-title">AI suggestions</span
    ><span class="gotipe-review-fact">2 suggestions</span
    ><span class="gotipe-tool-spacer"></span><span class="gotipe-button is-quiet">Reject all</span
    ><span class="gotipe-button is-primary">Accept all</span></div>
  <article class="gotipe-page" lang="en">
    <header class="gotipe-page-head"><h1 class="gotipe-page-title">Offline drafts</h1></header>
    <div class="gotipe-doc">
      <p>
        An edit made offline
        <span class="gotipe-delete" data-person="3">currently disappears</span
        ><span class="gotipe-insert" data-person="3">is lost</span> if the tab is closed before
        the connection comes back. The decision rests on ADR-0031.
      </p>
      <h2>How it works</h2>
      <p>
        The log lives in <code>IndexedDB</code> and survives an app restart. The server accepts
        a batch of transactions whole or rejects it.
      </p>
      <h2>Rollout order</h2>
      <ol class="gotipe-list">
        <li>Turn the log on for 5% of web users.</li>
        <li>
          Compare the share of lost edits with the control group for a week<span
            class="gotipe-insert"
            data-person="1"
            >: threshold — under 0.1%</span
          >.
        </li>
      </ol>
      <h2>What we leave alone</h2>
      <pre class="gotipe-raw">&lt;details&gt;
  &lt;summary&gt;The log in numbers&lt;/summary&gt;
  1,284 transactions queued
&lt;/details&gt;</pre>
    </div>
  </article>

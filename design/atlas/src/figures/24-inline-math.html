<figure class="at-figure" id="f24" data-section="New features">
  <figcaption class="at-figure-head">
    <span class="at-num">24</span>
    <h2 class="at-figure-title">Inline formula</h2>
    <p class="at-caption">
      The formula is set in the document font: variables in italics, the fraction on a bar; a click
      opens a TeX field, and the picture under it changes as you type. TeX that cannot be parsed
      stays in the line as is on a red background, the reason in a tooltip. The library draws the
      formula the same way, with its own TeX-to-MathML conversion; without a TeX reader the formula
      stays its own TeX.
    </p>
  </figcaption>
  <!-- @frame frame=math-inline view=notion w=480 label="formula in text" -->
  <article class="gotipe-page is-slice" lang="en">
    <div class="gotipe-doc">
      <h3>Release goal</h3>
      <p>
        The share of lost edits
        <span class="gotipe-math-inline" role="math" aria-label="p = \frac{L}{N}"
          ><i>p</i><span class="gotipe-mo">=</span><span class="gotipe-frac"><span><i>L</i></span><span><i>N</i></span></span></span
        >
        over a week must stay below
        <span class="gotipe-math-inline is-hover" role="math" aria-label="10^{-3}"
          >10<sup>−3</sup><svg class="at-pointer is-end"><use href="#i-pointer" /></svg></span
        >, where
        <span class="gotipe-math-inline" role="math" aria-label="L"><i>L</i></span> stands for the
        edits that never reached the server.
      </p>
    </div>
  </article>

    <h2 class="at-figure-title">Загрузка, ошибки, только чтение, фокус</h2>
    <p class="at-caption">
      Загрузка — силуэт страницы без мерцания. Ошибка — тост или сам элемент, без строки под полем.
      Редактор, который не создался, — сам элемент на месте страницы: так его показывает PageEditor;
      рядом предложение — плашка в колонке документа, слова нейтральные, как у изображения, — ждёт
      решения. Причина «нельзя» — в подсказке. Фокус с клавиатуры — кольцо темы, не браузера.
    </p>
  </figcaption>

<figure class="at-figure" id="f17" data-section="States">
  <figcaption class="at-figure-head">
    <span class="at-num">17</span>
    <h2 class="at-figure-title">Loading, errors, read only, focus</h2>
    <p class="at-caption">
      Loading is a page silhouette without flicker. An error is a toast or the element itself, with
      no line under the field. An editor that failed to create is a plate in place of the page, in
      the document column, with its margins: the words are neutral, only the icon is red, as with an
      image. The reason for "not allowed" is in the tooltip. Keyboard focus is the theme's ring, not
      the browser's.
    </p>
  </figcaption>
  <!-- @frame frame=loading view=notion w=480 label="loading" -->
  <article class="gotipe-page" lang="en" aria-busy="true">
    <div class="gotipe-skeleton">
      <span class="is-title"></span><span class="is-meta"></span><span></span><span class="is-90"></span
      ><span class="is-75"></span><span class="is-block"></span><span class="is-90"></span><span class="is-60"></span>
    </div>
  </article>

  <!-- @frame frame=save-error view=notion w=768 label="not saved" -->
  <div class="gotipe-toast" role="status">
    <svg class="gt-icon"><use href="#i-warning" /></svg>Not saved: no connection<span class="gotipe-button">Try again</span>
  </div>
  <article class="gotipe-page is-slice" lang="en">
    <div class="gotipe-doc">
      <h2>How it works</h2>
      <p>The log lives in IndexedDB and survives an app restart. The server accepts a batch of transactions whole or rejects it.</p>
    </div>
  </article>
  <!-- @end -->

  </article>

<figure class="at-figure" id="f27" data-section="New features">
  <figcaption class="at-figure-head">
    <span class="at-num">27</span>
    <h2 class="at-figure-title">Alignment, font and size</h2>
    <p class="at-caption">
      Alignment is a block property: four items under “More” in the toolbar over the selection, with shortcuts beside them; a heading and paragraphs go center, right or justified. The fixed modern toolbar holds the font and size of the selection: each font is named in its own face, and the size changes by one step.
    </p>
  </figcaption>

    <div class="gotipe-doc">
      <h2 data-align="center">Offline drafts</h2>
      <p data-align="center">Release 2.8 · November 11, 2026</p>
      <p data-align="justify">
        An edit made offline is currently lost if the tab is closed before the connection returns. In release 2.8 the editor writes every transaction to a local log and sends it as soon as the network is back, and the server accepts a batch of transactions whole or rejects it.
      </p>
      <p data-align="right">Maria Lebedeva, release lead</p>

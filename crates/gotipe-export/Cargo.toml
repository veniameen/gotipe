[package]
name = "gotipe-export"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Import and export for GoTipe documents: Markdown, HTML, JSON, and its own PDF layout and DOCX writer."
repository.workspace = true
homepage.workspace = true
keywords = ["pdf", "docx", "markdown", "export", "editor"]
categories = ["text-processing", "encoding"]

[features]
default = ["html", "markdown", "plaintext"]
html = ["ammonia"]
markdown = []
plaintext = []
pdf = ["dep:pdf-writer", "dep:harfrust", "dep:read-fonts", "dep:subsetter", "dep:unicode-bidi", "dep:unicode-segmentation", "dep:flate2", "image-data"]
docx = ["dep:zip", "image-data"]
image-data = ["dep:image"]
notion = []
cli = ["dep:gotipe-crdt"]

[dependencies]
gotipe-core = { version = "0.1.0", path = "../gotipe-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true, features = ["unicode-gencat"] }
ammonia = { workspace = true, optional = true }

pdf-writer = { workspace = true, optional = true }
harfrust = { workspace = true, optional = true }
read-fonts = { workspace = true, optional = true }
subsetter = { workspace = true, optional = true }
unicode-bidi = { workspace = true, optional = true }
unicode-segmentation = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }

gotipe-crdt = { version = "0.1.0", path = "../gotipe-crdt", default-features = false, optional = true }

[[bin]]
name = "gotipe-convert"
path = "src/bin/convert.rs"
required-features = ["html", "markdown", "cli"]

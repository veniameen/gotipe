[package]
name = "gotipe-crdt"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CRDT for GoTipe documents: concurrent and offline edits merge into one document, with cursors."
repository.workspace = true
homepage.workspace = true
keywords = ["crdt", "collaboration", "editor", "sync", "offline"]
categories = ["data-structures", "text-editors"]

[features]
default = ["compression"]
compression = []

[dependencies]
gotipe-core = { version = "0.1.0", path = "../gotipe-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

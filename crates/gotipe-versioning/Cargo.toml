[package]
name = "gotipe-versioning"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Document versions for GoTipe: snapshots, block-level comparison and restore."
repository.workspace = true
homepage.workspace = true
keywords = ["editor", "versioning", "diff", "history"]
categories = ["text-editors", "data-structures"]

[features]
default = ["compression"]
compression = ["dep:zstd", "gotipe-crdt/compression"]

[dependencies]
gotipe-core = { version = "0.1.0", path = "../gotipe-core", features = ["clock"] }
gotipe-crdt = { version = "0.1.0", path = "../gotipe-crdt", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zstd = { workspace = true, optional = true }
uuid = { workspace = true }

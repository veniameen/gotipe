[package]
name = "gotipe-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gotipe-schema = { path = "../gotipe-schema" }
gotipe-core = { path = "../gotipe-core" }
gotipe-crdt = { path = "../gotipe-crdt", default-features = false }
gotipe-comments = { path = "../gotipe-comments" }
gotipe-versioning = { path = "../gotipe-versioning", default-features = false }
gotipe-ai = { path = "../gotipe-ai" }
gotipe-export = { path = "../gotipe-export" }
wasm-bindgen = { workspace = true }
serde-wasm-bindgen = "0.6"
serde_json = { workspace = true }
serde = { workspace = true }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

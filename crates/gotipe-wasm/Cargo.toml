[package]
name = "gotipe-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly bindings of the GoTipe editor engine (the @gotipe/wasm npm package)."
repository.workspace = true
homepage.workspace = true
keywords = ["editor", "wasm", "crdt", "rich-text"]
categories = ["wasm", "text-editors"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gotipe-schema = { version = "0.1.0", path = "../gotipe-schema" }
gotipe-core = { version = "0.1.0", path = "../gotipe-core" }
gotipe-crdt = { version = "0.1.0", path = "../gotipe-crdt", default-features = false }
gotipe-comments = { version = "0.1.0", path = "../gotipe-comments" }
gotipe-versioning = { version = "0.1.0", path = "../gotipe-versioning", default-features = false }
gotipe-ai = { version = "0.1.0", path = "../gotipe-ai" }
wasm-bindgen = { workspace = true }
serde-wasm-bindgen = "0.6"
serde_json = { workspace = true }
serde = { workspace = true }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

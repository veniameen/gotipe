[package]
name = "gotipe-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The GoTipe editor engine: document model, transactions, selection, history and tables."
repository.workspace = true
homepage.workspace = true
keywords = ["editor", "rich-text", "wysiwyg", "document"]
categories = ["text-editors", "data-structures"]

[dependencies]
gotipe-schema = { version = "0.1.0", path = "../gotipe-schema" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[features]
# Timestamp::now: the system clock, or in a browser, which gives WebAssembly no system clock,
# the JavaScript one. Comments and versions turn it on; the exporters need no clock.
clock = ["dep:js-sys"]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = { version = "0.3", optional = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "transform"
harness = false

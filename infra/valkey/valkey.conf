# infra/valkey/valkey.conf
# Valkey 8 configuration for GoTipe Cloud.
# Valkey reads one directive per line; "#" starts a comment only at the
# beginning of a line, so keep comments on their own lines.

# --- Network ---
# Reachable only on the compose backend network.
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 60

# --- Memory ---
# Everything GoTipe keeps here is security or integrity state with its own TTL,
# not a disposable cache:
#   jwt:blocklist:*   revoked access tokens, until the token would expire
#   idempotency:*     claims and replies of mutations, 24 hours; a stored
#                     reply is at most 256 KiB, larger replies keep only
#                     their status
#   rl:*              sliding-window rate limits, one window
# Evicting any of them is a failure: a revoked token would work again, a
# retried mutation would run twice, a client's limit would reset. The
# eviction policy applies to the whole instance (it cannot differ per
# database), so nothing may be evicted. When memory is full Valkey refuses
# writes and the API answers 503 instead of forgetting state.
# Size maxmemory for a day of idempotency records plus the rate-limit windows,
# and alert on used_memory before it reaches the limit.
maxmemory 1gb
maxmemory-policy noeviction

# --- Persistence (AOF) ---
# Revocations and idempotency claims must survive a restart.
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes

# --- RDB snapshots ---
# After 900 s with 1 change, 300 s with 10 changes, 60 s with 10000 changes.
save 900 1 300 10 60 10000
rdbcompression yes
rdbchecksum yes

# --- Databases ---
# GoTipe uses database 0 only (VALKEY_URL redis://valkey:6379/0).
databases 1

# --- Connections ---
maxclients 1000

# --- Logging ---
loglevel notice
# Empty: log to stdout, which Docker captures.
logfile ""

# --- Security ---
# Valkey does not read VALKEY_PASSWORD. To require a password, add
# "requirepass <secret>" here and set the same secret in VALKEY_PASSWORD for
# the API (and in the compose health check).

# --- Lua scripting ---
# Rate-limit and idempotency scripts are short; flag anything slower than 200 ms.
lua-time-limit 200

# --- Slow log ---
# Log commands slower than 10 ms.
slowlog-log-slower-than 10000
slowlog-max-len 128

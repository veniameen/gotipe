# infra/pgbackrest/pgbackrest.conf
# pgBackRest: PostgreSQL backups and WAL archive in Cloudflare R2 (S3 API).
#
# Opt-in only. The stock postgres:17-alpine image has no pgBackRest and
# infra/postgres/postgresql.conf keeps WAL archiving off. To use this file, run
# PostgreSQL from an image that contains pgBackRest, mount this file at
# /etc/pgbackrest/pgbackrest.conf, then follow "Backups" in
# docs-site/cloud/overview.md.
#
# pgBackRest does not expand ${VARIABLES} in this file. Give the endpoint and
# the secrets to the PostgreSQL container as environment variables:
#   PGBACKREST_REPO1_S3_ENDPOINT=<account id>.r2.cloudflarestorage.com
#   PGBACKREST_REPO1_S3_KEY=<access key id>
#   PGBACKREST_REPO1_S3_KEY_SECRET=<secret access key>
#   PGBACKREST_REPO1_CIPHER_PASS=<long random passphrase; keep a copy offline>

[gotipe]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-socket-path=/var/run/postgresql

[global]
# --- Repository: Cloudflare R2 (S3-compatible) ---
repo1-type=s3
repo1-s3-bucket=gotipe-backups
repo1-s3-region=auto
repo1-s3-uri-style=path

# --- Encryption (passphrase from PGBACKREST_REPO1_CIPHER_PASS) ---
repo1-cipher-type=aes-256-cbc

# --- Retention ---
# Keep 4 full backups (about a month) and 30 differential backups.
repo1-retention-full=4
repo1-retention-diff=30

# --- Compression ---
compress-type=zst
compress-level=3

# --- Parallel backup processes ---
process-max=2

# --- Archive ---
[global:archive-push]
compress-type=zst
compress-level=3

[global:archive-get]
process-max=2

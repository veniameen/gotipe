# infra/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  # --- GoTipe API Server ---
  - job_name: gotipe-api
    static_configs:
      - targets: ["api:8080"]
    metrics_path: /metrics
    scrape_interval: 10s

  # --- GoTipe WebSocket Sync Server ---
  - job_name: gotipe-sync
    static_configs:
      - targets: ["sync:8081"]
    metrics_path: /metrics
    scrape_interval: 10s

  # --- PostgreSQL (via postgres_exporter) ---
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # --- Valkey (via valkey-exporter) ---
  - job_name: valkey
    static_configs:
      - targets: ["valkey-exporter:9121"]

  # --- Prometheus self-monitoring ---
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

# infra/postgres/postgresql.conf
# PostgreSQL 17 — tuned for Hetzner CX32 (4 vCPU, 8 GB RAM)

# --- Memory ---
shared_buffers = 2GB                    # 25% of RAM
effective_cache_size = 6GB              # 75% of RAM
work_mem = 64MB                         # per-operation sort/hash memory
maintenance_work_mem = 512MB            # for VACUUM, CREATE INDEX

# --- Connections ---
max_connections = 200                   # pgBouncer handles client connections
superuser_reserved_connections = 3

# --- WAL ---
wal_level = replica                     # allows a WAL archive or a replica later
max_wal_size = 2GB
min_wal_size = 512MB
wal_compression = zstd

# --- WAL archiving: off unless pgBackRest is installed and configured ---
# The stock postgres:17-alpine image has no pgBackRest. With archive_mode on,
# a failing archive_command keeps every WAL segment until the disk is full,
# so archiving stays off here. To enable point-in-time recovery, run an image
# with pgBackRest, mount infra/pgbackrest/pgbackrest.conf, create the stanza,
# check it, and only then set (a restart is required):
#   archive_mode = on
#   archive_command = 'pgbackrest --stanza=gotipe archive-push %p'
# See "Backups" in docs-site/cloud/overview.md.
archive_mode = off

# --- Checkpoints ---
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min

# --- Query Planner ---
random_page_cost = 1.1                  # NVMe SSD
effective_io_concurrency = 200          # NVMe SSD
default_statistics_target = 100

# --- Parallel Query ---
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# --- Logging ---
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 200        # log queries slower than 200ms
log_checkpoints = on
log_connections = off                   # pgBouncer reconnects frequently
log_disconnections = off
log_lock_waits = on

# --- Autovacuum ---
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05   # more aggressive for busy tables
autovacuum_analyze_scale_factor = 0.025

# --- Locale ---
lc_messages = 'en_US.UTF-8'
timezone = 'UTC'

# --- Listen ---
listen_addresses = '*'
port = 5432

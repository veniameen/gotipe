name: Bug report
description: Something behaves differently from the docs, or an edit breaks a document.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Security problems go through [private vulnerability reporting](https://github.com/veniameen/gotipe/security/advisories/new), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest steps, document or Markdown that shows the problem.
      placeholder: |
        1. Open …
        2. Type …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core and commands (@gotipe/core)
        - Block editor UI (@gotipe/block-editor)
        - Framework adapters (React, Vue, Svelte, Solid)
        - Markdown
        - Collaboration
        - Comments, suggestions and versions
        - AI
        - Export (PDF, DOCX) and Rust crates
        - GoTipe Cloud
        - Docs or website
        - Not sure
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Package or crate versions and the engine (`js`, `wasm` or `auto`).
      placeholder: "@gotipe/block-editor 0.1.0, engine: wasm"
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: "Chrome 131, macOS 15"
  - type: textarea
    id: logs
    attributes:
      label: Errors or logs
      description: Console output or stack traces, if any.
      render: text

name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work. API sketches and Markdown examples are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use today, or other approaches you considered.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core and commands (@gotipe/core)
        - Block editor UI (@gotipe/block-editor)
        - Framework adapters (React, Vue, Svelte, Solid)
        - Markdown
        - Collaboration
        - Comments, suggestions and versions
        - AI
        - Export (PDF, DOCX) and Rust crates
        - GoTipe Cloud
        - Docs or website

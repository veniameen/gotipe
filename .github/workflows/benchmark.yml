# .github/workflows/benchmark.yml
name: Benchmarks

on:
  pull_request:
    paths:
      - "crates/**"
      - "packages/**"

permissions:
  contents: read

jobs:
  criterion:
    name: Rust Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: main-branch

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Benchmark base commit
        working-directory: main-branch
        run: cargo bench --locked -p gotipe-core --bench transform -- --save-baseline main
        env:
          CARGO_BUILD_JOBS: 2
          CARGO_TARGET_DIR: ${{ github.workspace }}/target

      - name: Benchmark PR branch
        run: cargo bench --locked -p gotipe-core --bench transform -- --save-baseline pr
        env:
          CARGO_BUILD_JOBS: 2
          CARGO_TARGET_DIR: ${{ github.workspace }}/target

      - name: Compare measured Criterion estimates
        run: python3 scripts/quality/compare-benchmarks.py

      - uses: actions/upload-artifact@v4
        with:
          name: criterion-comparison
          path: output/benchmark-comparison.md

  wasm-size:
    name: WASM Size Tracking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack + wasm-opt
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          npm install -g binaryen

      - name: Build WASM
        run: bash scripts/build-wasm.sh

      - name: WASM size breakdown
        id: wasm-size
        run: node scripts/check-wasm-size.mjs

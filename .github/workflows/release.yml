# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default. With id-token: write a job of this run can sign in to
# npm as release.yml (trusted publishing), so only the release job gets it, not
# the called check workflows that run third-party code.
permissions:
  contents: read

jobs:
  checks:
    name: Required Rust, Go, TypeScript and package checks
    uses: ./.github/workflows/ci.yml

  browsers:
    name: Required browser matrix
    uses: ./.github/workflows/e2e.yml

  security:
    name: Required dependency security checks
    uses: ./.github/workflows/security.yml

  release:
    name: Release
    needs: [checks, browsers, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub Release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for changelog

      # -- Rust + WASM --
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install wasm-opt
        run: npm install -g binaryen

      - name: Build WASM
        run: bash scripts/build-wasm.sh

      - name: Build optional PDF and DOCX exporter
        run: bash scripts/build-export-wasm.sh

      # -- TypeScript --
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      # No registry-url: npm signs in through trusted publishing (see below).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce release architecture without legacy allowances
        run: pnpm check:architecture:release && pnpm check:theme

      - name: Build all TS packages
        run: pnpm build --concurrency=2

      - name: Run tests
        run: pnpm test --concurrency=2 -- --maxWorkers=2

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Complete JavaScript import graph budgets
        run: pnpm check:bundles

      - name: Check package archives and entrypoints
        run: pnpm check:packages

      - name: Install independent PDF validators
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-pypdf

      - name: Install archives in an isolated consumer
        run: pnpm check:consumer

      - name: Validate actual PDF and DOCX output
        run: |
          pnpm check:exports
          pnpm check:pdf-regression

      - name: Verify registry source dependency graph
        run: pnpm check:cargo-release

      # -- Publish npm packages (dependency order) --
      # This job publishes npm. The Rust crates go to crates.io through
      # publish-crates.yml, run by hand once these checks have passed.
      #
      # npm trusted publishing (OIDC), no stored npm token: for each new version
      # npm trades this job's GitHub OIDC token for a short-lived token of that
      # one package. npmjs.com allows it only if the package's settings hold this
      # trusted publisher: GitHub Actions, user veniameen, repository gotipe,
      # workflow release.yml, no environment, allowed action "npm publish".
      # A new one expires unless a publish uses it within two days, and only a
      # package that already exists can have one, so add it just before the
      # release that first publishes the package this way. Without it npm stops
      # with ENEEDAUTH (a registry-url placeholder token would turn that into a
      # misleading 404), and the step after the publish prints npm's reason.
      # https://docs.npmjs.com/trusted-publishers
      - name: Install npm 11 for trusted publishing
        # Node 22 ships npm 10; trusted publishing needs npm 11.5.1 or later.
        # pnpm runs the npm next to its node, which is the one this replaces.
        run: |
          npm install --global npm@11.21.2
          npm --version

      - name: Publish npm packages
        id: publish
        # pnpm skips versions already on npm and hands each new tarball to npm
        # in dependency order. `pnpm -r publish` does not pass --provenance on,
        # but npm reads this variable and then refuses a version it cannot sign.
        run: pnpm --filter './packages/**' -r publish --access public --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Show why npm could not use trusted publishing
        if: failure() && steps.publish.outcome == 'failure'
        run: grep -h -E "oidc/token/exchange|(silly|verbose) oidc" ~/.npm/_logs/*-debug-0.log

      # -- Generate changelog --
      - name: Generate changelog
        id: changelog
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            git log --pretty=format:"- %s (%h)" "$PREVIOUS_TAG"..HEAD > CHANGELOG_ENTRY.md
          else
            git log --pretty=format:"- %s (%h)" > CHANGELOG_ENTRY.md
          fi

      # -- GitHub Release --
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: CHANGELOG_ENTRY.md

  starters:
    name: Starters on the published packages
    needs: release
    uses: ./.github/workflows/examples.yml

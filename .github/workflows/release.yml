# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  checks:
    name: Required Rust, Go, TypeScript and package checks
    uses: ./.github/workflows/ci.yml

  browsers:
    name: Required browser matrix
    uses: ./.github/workflows/e2e.yml

  security:
    name: Required dependency security checks
    uses: ./.github/workflows/security.yml

  release:
    name: Release
    needs: [checks, browsers, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for changelog

      # -- Rust + WASM --
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install wasm-opt
        run: npm install -g binaryen

      - name: Build WASM
        run: bash scripts/build-wasm.sh

      - name: Build optional PDF and DOCX exporter
        run: bash scripts/build-export-wasm.sh

      # -- TypeScript --
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce release architecture without legacy allowances
        run: pnpm check:architecture:release && pnpm check:theme

      - name: Build all TS packages
        run: pnpm build --concurrency=2

      - name: Run tests
        run: pnpm test --concurrency=2 -- --maxWorkers=2

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Complete JavaScript import graph budgets
        run: pnpm check:bundles

      - name: Check package archives and entrypoints
        run: pnpm check:packages

      - name: Install independent PDF validators
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-pypdf

      - name: Install archives in an isolated consumer
        run: pnpm check:consumer

      - name: Validate actual PDF and DOCX output
        run: |
          pnpm check:exports
          pnpm check:pdf-regression

      - name: Verify registry source dependency graph
        run: pnpm check:cargo-release

      # -- Publish npm packages (dependency order) --
      - name: Publish npm packages
        run: pnpm --filter './packages/**' -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # -- Publish Rust crates (dependency order) --
      - name: Publish Rust crates
        run: |
          CRATES=(
            "gotipe-schema"
            "gotipe-core"
            "gotipe-crdt"
            "gotipe-comments"
            "gotipe-versioning"
            "gotipe-ai"
            "gotipe-export"
            "gotipe-export-wasm"
            "gotipe-wasm"
          )
          for crate in "${CRATES[@]}"; do
            echo "Publishing ${crate}..."
            cargo publish --locked -p "$crate"
            sleep 30  # crates.io rate limit
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}

      # -- Generate changelog --
      - name: Generate changelog
        id: changelog
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            git log --pretty=format:"- %s (%h)" "$PREVIOUS_TAG"..HEAD > CHANGELOG_ENTRY.md
          else
            git log --pretty=format:"- %s (%h)" > CHANGELOG_ENTRY.md
          fi

      # -- GitHub Release --
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: CHANGELOG_ENTRY.md

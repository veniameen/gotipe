# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for changelog

      # -- Rust + WASM --
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install wasm-opt
        run: npm install -g binaryen

      - name: Build WASM
        run: bash scripts/build-wasm.sh

      # -- TypeScript --
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all TS packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      # -- Publish npm packages (dependency order) --
      - name: Publish npm packages
        run: |
          PACKAGES=(
            "wasm"
            "core"
            "react"
            "vue"
            "svelte"
            "solid"
            "collaboration"
            "ai"
            "export"
            "block-editor"
            "block-editor-vue"
            "ai-ui"
            "theme"
          )
          for pkg in "${PACKAGES[@]}"; do
            echo "Publishing @gotipe/${pkg}..."
            pnpm --filter "@gotipe/${pkg}" publish --access public --no-git-checks --provenance || true
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # -- Publish Rust crates (dependency order) --
      - name: Publish Rust crates
        run: |
          CRATES=(
            "gotipe-schema"
            "gotipe-core"
            "gotipe-crdt"
            "gotipe-comments"
            "gotipe-versioning"
            "gotipe-ai"
            "gotipe-export"
            "gotipe-wasm"
          )
          for crate in "${CRATES[@]}"; do
            echo "Publishing ${crate}..."
            cargo publish -p "$crate" --allow-dirty || true
            sleep 30  # crates.io rate limit
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}

      # -- Generate changelog --
      - name: Generate changelog
        id: changelog
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if command -v changeset &> /dev/null; then
            npx changeset status --output=CHANGELOG_ENTRY.md
          else
            git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 HEAD^)..HEAD > CHANGELOG_ENTRY.md
          fi

      # -- GitHub Release --
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: CHANGELOG_ENTRY.md

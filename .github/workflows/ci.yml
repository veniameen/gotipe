# .github/workflows/ci.yml
name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  GOMAXPROCS: 2

jobs:
  # ============================================================
  # Rust: fmt, clippy, tests, optimized harness compilation
  # ============================================================
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --keep-going --all-targets --all-features -- -D warnings

      - name: Verify distributed dependency notices
        run: python3 scripts/collect-rust-licenses.py --check

      - name: Unit tests
        env:
          GOTIPE_PDF_CORPUS_OUTPUT: ${{ github.workspace }}/output/pdf-native-corpus
        run: cargo test --locked --workspace --all-features

      - name: Upload native PDF corpus
        uses: actions/upload-artifact@v4
        with:
          name: native-pdf-corpus
          path: output/pdf-native-corpus/
          if-no-files-found: error
          retention-days: 1

      - name: Compile optimized test and benchmark harnesses
        run: cargo bench --locked --no-run

  # ============================================================
  # WASM: build + optimize + size check + artifact upload
  # ============================================================
  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install wasm-opt (binaryen)
        run: npm install -g binaryen

      - name: Build WASM
        run: bash scripts/build-wasm.sh

      - name: WASM size report
        run: node scripts/check-wasm-size.mjs

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: packages/wasm/pkg/
          retention-days: 1

  # ============================================================
  # TypeScript: lint, typecheck, build, test, bundle size
  # ============================================================
  exporter:
    name: Optional PDF and DOCX exporter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build optional export module
        run: bash scripts/build-export-wasm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: exporter-pkg
          path: packages/export-wasm/pkg/
          retention-days: 1

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    needs: [rust, wasm, exporter]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: packages/wasm/pkg/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download optional exporter artifact
        uses: actions/download-artifact@v4
        with:
          name: exporter-pkg
          path: packages/export-wasm/pkg/

      - name: Download native PDF corpus
        uses: actions/download-artifact@v4
        with:
          name: native-pdf-corpus
          path: output/pdf-native-corpus/

      - name: Lint (Biome)
        run: pnpm lint

      - name: Architecture boundaries and size budgets
        run: pnpm check:architecture && pnpm check:theme

      - name: Type check
        run: pnpm typecheck

      - name: Build all packages
        run: pnpm build --concurrency=2

      - name: Check package archives and entrypoints
        run: pnpm check:packages

      - name: Install independent PDF validators
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-pypdf

      - name: Install archives in an isolated consumer
        run: pnpm check:consumer

      - name: Validate actual PDF and DOCX output
        run: |
          pnpm check:exports
          node scripts/pdf-regression.mjs --native-dir output/pdf-native-corpus --out output/pdf-regression

      - name: Unit tests (Vitest)
        run: pnpm test --concurrency=2 -- --maxWorkers=2

      - name: Complete JavaScript import graph budgets
        run: pnpm check:bundles

  # ============================================================
  # Go: vet, test (race detector), build
  # ============================================================
  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cloud
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gotipe
          POSTGRES_PASSWORD: gotipe
          POSTGRES_DB: gotipe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cloud/go.mod
          cache-dependency-path: apps/cloud/go.sum

      - name: Vet
        run: go vet ./...

      - name: Run migrations
        run: go run ./cmd/api migrate up
        env:
          DATABASE_URL: postgres://gotipe:gotipe@localhost:5432/gotipe_test?sslmode=disable

      - name: Tests (race detector)
        run: go test -p 2 -tags integration ./... -race -count=1 -coverprofile=coverage.out
        env:
          GOTIPE_TEST_DATABASE_URL: postgres://gotipe:gotipe@localhost:5432/gotipe_test?sslmode=disable
          DATABASE_URL: postgres://gotipe:gotipe@localhost:5432/gotipe_test?sslmode=disable
          VALKEY_URL: redis://localhost:6379/0

      - name: Verify distributed dependency notices
        run: python3 ../../scripts/collect-cloud-licenses.py --check

      - name: Build
        run: go build -p 2 -o "$RUNNER_TEMP/" ./cmd/...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: apps/cloud/coverage.out
          retention-days: 7
